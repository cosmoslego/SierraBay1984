author: Lexanx
changes:
  - bugfix: Персистенс не сбрасывается, если эвакуацию объявили, под 
      катапультировали, а эвакуацию потом отменили.
  - bugfix: Гетерохромия рисуется под очками.
  - bugfix: В экзофабе есть конечности поверлоадера, нет лишней тяжёлой ноги. 
      Плата recharger печатается.
  - bugfix: Пустой диск для автолата печатается в General
  - bugfix: Любой эмоут, включая крик от боли, теперь только раз в 2 сек
  - bugfix: Боевой режим теперь поворачивает персонажа в любое место куда 
      смотрит мышь
  - bugfix: Убраны повторные прически
  - bugfix: Можно снимать и свапать бумагу на аномали контейнере
  - bugfix: Закрыл дырку в космосе у мостика
  - bugfix: Сенсоры имеют только 1 тесла линк
  - tweak: Добавлен доступ к управлению фармботу, ученым и инженерам
delete-after: true
