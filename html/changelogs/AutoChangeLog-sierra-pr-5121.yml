author: Aigamuxa
changes:
  - bugfix: Сетевые ID шлюзов, ЛКП, воздушных и пожарных тревог и камер теперь 
      уникальны.
  - bugfix: Команда connect с несуществующим ID больше не вызывает ошибку, а 
      отвечает «Unknown ID».
  - bugfix: Команда connect больше не управляет шлюзами, ЛКП и воздушными 
      тревогами, если их провод управления ИИ перерезан или отключён.
  - bugfix: Команды освещения ЛКП через connect работают так же, как кнопки 
      освещения в окне ЛКП.
  - tweak: Сетевые ID устройств теперь четырёхзначные (например, AL1234).
  - tweak: Камеру теперь можно отключить от команды connect, перерезав провод, 
      на котором указан её NTNet ID.
  - tweak: Команды connect записываются в журнал NTNet с сетевым тегом 
      отправителя, включая отклонённые попытки без доступа.
  - tweak: Команда connect работает только при подключении к NTNet.
  - tweak: ID в команде connect можно вводить строчными буквами.
  - tweak: Разблокированные ЛКП и воздушные тревоги принимают команды connect 
      без доступа, как при работе с ними вручную.
delete-after: true
